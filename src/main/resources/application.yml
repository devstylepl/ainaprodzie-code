spring:
  application:
    name: retrofit
  datasource:
    # No defaults here: an instance started without DB_URL, DB_USERNAME and
    # DB_PASSWORD fails at startup instead of trying a local database. The dev
    # and test profiles below carry the local fallbacks.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Never leave this empty: with no contexts Liquibase runs every changeset,
    # including the dev seed (context: dev) with its well-known passwords.
    contexts: schema
  session:
    timeout: 8h
    jdbc:
      # Session tables are owned by Liquibase (db-202610071200-spring-session.yaml).
      initialize-schema: never
  ai:
    # The chat uses only a chat model; the OpenAI starter would otherwise create its embedding, image, audio,
    # moderation and decision models too.
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
      decision: none
    # The OpenAI client talks to the LiteLLM proxy, which maps the alias to a provider model (chat ADR 0002). No
    # defaults for the URL and the key, like the datasource.
    openai:
      base-url: ${LITELLM_URL}
      api-key: ${LITELLM_KEY}
      # The SDK retries once, and LiteLLM retries each provider call once more: the two layers multiply. LiteLLM's
      # retry is dropped while the chat's fallback setting is AT_ONCE, its default (chat ADR 0019).
      max-retries: 1
      # Longer than LiteLLM's 15s provider call and its one retry (litellm/config.yaml), so the gateway gives up first
      # and its retry fits into one call of the app. It bounds the SDK's own retry too: after LiteLLM's timeout at about
      # 31s the retry has the few seconds left. A local model that reasons before it answers may need longer.
      timeout: ${CHAT_MODEL_TIMEOUT:35s}
    tools:
      limits:
        # At most 6 tool calls per question. The next one ends the turn, which the chat answers as failed: a model
        # that keeps repeating a search spends the quota without getting closer to an answer.
        max-total-tool-calls: 6
        on-limit-exceeded: throw
      observations:
        # Spring AI's own copy of the tool arguments and results on the span would leave the app unmasked; the chat
        # adds them under the GenAI names, which MaskingSpanExporter masks (chat ADR 0007).
        include-content: false
    # Spring AI can log every prompt and answer, unmasked. They stay off: no log line holds a question, an answer or a
    # tool result (chat ADR 0007).
    chat:
      observations:
        log-prompt: false
        log-completion: false
      client:
        observations:
          log-prompt: false
          log-completion: false

retrofit:
  # Version of this server build. spring-boot-starter-parent filters
  # application*.yml with @..@ delimiters, so this must stay quoted: an
  # unquoted @ is not a valid YAML plain scalar.
  api-version: "@project.version@"
  chat:
    # The LiteLLM aliases support staff choose the chat's model from on the settings page; each must be in
    # litellm/config.yaml. Until someone chooses, the chat uses chat-gemini, the default of the stored setting.
    models: chat-gemini,chat-anthropic,chat-chaos
    # One deadline for a whole question, model and tool calls together. Without it a turn could take about eight
    # minutes: up to seven model calls, each with the client's timeout and one retry.
    turn-timeout: ${CHAT_TURN_TIMEOUT:70s}
    # A conversation nobody asks in for this long is forgotten, its memory and its placeholders together, so the
    # personal data behind the placeholders does not stay in the process until a restart (chat ADR 0005). Longer than
    # turn-timeout, so a turn still streaming is never forgotten as idle.
    conversation-idle-timeout: ${CHAT_CONVERSATION_IDLE_TIMEOUT:30m}
    # Presidio masks the chat's texts in its traces before they leave the app (chat ADR 0007). No defaults, like the
    # datasource.
    presidio:
      analyzer-url: ${PRESIDIO_ANALYZER_URL}
      anonymizer-url: ${PRESIDIO_ANONYMIZER_URL}

server:
  shutdown: graceful
  # A TLS-terminating proxy sits in front of the app; honour X-Forwarded-* headers.
  request:
    header:
      forwarded:
        strategy: framework

management:
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness on any
      # platform, not only when Kubernetes is detected.
      probes:
        enabled: true
  # Every question of the chat is traced and exported over OTLP (chat ADR 0007). No default for the endpoint, like the
  # datasource.
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      # The Phoenix project LiteLLM's spans go to as well, so a question's trace and its model calls share one project.
      "[openinference.project.name]": retrofit
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL}
  observations:
    enable:
      # Their spans would bury the chat's in every trace.
      spring.security: false
      tasks.scheduled: false
      # The model client's HTTP calls run on OkHttp's own threads, outside the question's trace, so each would be a
      # trace of its own; the model call span already covers them.
      okhttp.requests: false
  otlp:
    metrics:
      export:
        # The OpenTelemetry starter also pushes metrics over OTLP; only traces have a backend.
        enabled: false

springdoc:
  api-docs:
    # The API docs endpoint is a dev/test tool, not a production surface.
    # OpenApiExportTests (test profile) generates the committed contract from it.
    enabled: false

logging:
  level:
    # Both log a failed model call or tool call with its message, which can quote the user's words: the model's
    # arguments, or LiteLLM's echo of the request. The chat logs the same failures itself without any message
    # (RedactedFailure), so no log line holds a question, an answer or a tool result (chat ADR 0007).
    org.springframework.ai.chat.model.MessageAggregator: "off"
    org.springframework.ai.tool.method.MethodToolCallback: "off"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Local fallbacks; spring-boot-docker-compose replaces them with the
    # compose.yaml container's connection details.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retrofit}
    username: ${DB_USERNAME:retrofit}
    password: ${DB_PASSWORD:retrofit}
  liquibase:
    contexts: schema,dev
  ai:
    openai:
      # LiteLLM from compose.yaml; the key is the app's virtual key, which litellm/app_key.py creates there, not a
      # provider key and not LiteLLM's master key.
      base-url: ${LITELLM_URL:http://localhost:4000}
      api-key: ${LITELLM_KEY:sk-retrofit-app-key}

retrofit:
  chat:
    # Presidio from compose.yaml.
    presidio:
      analyzer-url: ${PRESIDIO_ANALYZER_URL:http://localhost:5002}
      anonymizer-url: ${PRESIDIO_ANONYMIZER_URL:http://localhost:5001}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          # Phoenix from compose.yaml; its UI is http://localhost:6006.
          endpoint: ${OTLP_TRACES_URL:http://localhost:6006/v1/traces}

springdoc:
  api-docs:
    enabled: true

logging:
  level:
    # On macOS, Tomcat logs "Error setting socket options" at ERROR when a client closes a connection before it is
    # accepted (the dev proxy, a browser preconnect, a port probe). The connection was already gone; the line is noise.
    org.apache.tomcat.util.net.NioEndpoint: "off"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Local fallbacks; Testcontainers replaces them (@ServiceConnection).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retrofit}
    username: ${DB_USERNAME:retrofit}
    password: ${DB_PASSWORD:retrofit}
  ai:
    model:
      # No model and no key in the regular tests: the chat's test configuration provides a scripted ChatModel.
      chat: none

retrofit:
  chat:
    # Short, so the suite that waits for it stays fast; a scripted turn takes milliseconds.
    turn-timeout: 3s
    # Never called: the chat's test configuration replaces Presidio with a stub masker.
    presidio:
      analyzer-url: ${PRESIDIO_ANALYZER_URL:http://localhost:5002}
      anonymizer-url: ${PRESIDIO_ANONYMIZER_URL:http://localhost:5001}

management:
  tracing:
    # Nothing leaves the regular tests: the chat's test configuration collects the spans in memory instead.
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:6006/v1/traces}

springdoc:
  api-docs:
    enabled: true

logging:
  level:
    # Each test context logs the whole Liquibase run and Spring's startup
    # chatter; at INFO that buries test results in `./mvnw test` output.
    liquibase: warn
    org.springframework: warn
